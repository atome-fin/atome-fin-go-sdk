                platform:
                  type: string
                  enum:
                  - ANDROID
                  - IOS
                gps:
                  type: object
                  properties:
                    longitude:
                      type: string
                    latitude:
                      type: string
                    time:
                      type: string
                      description: GPS sample time (Unix milliseconds, as string).
                device:
                  type: object
                  properties:
                    utdid:
                      type: string
                    isRoot:
                      type: boolean
                    androidId:
                      type: string
                    build:
                      type: object
                      description: Android `Build.*` fields; required for Android clients.
                      properties:
                        board:
                          type: string
                        brand:
                          type: string
                        cpuAbi:
                          type: string
                        device:
                          type: string
                        manufacturer:
                          type: string
                        model:
                          type: string
                        product:
                          type: string
                wifiList:
                  type: array
                  description: Visible Wi-Fi networks at submission time.
                  items:
                    type: object
                    properties:
                      ssid:
                        type: string
                ipAddress:
                  type: object
                  properties:
                    ethIp:
                      type: string
                    trueIp:
                      type: string
