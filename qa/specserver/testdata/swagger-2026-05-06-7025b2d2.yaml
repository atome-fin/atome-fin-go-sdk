openapi: 3.0.0
info:
  x-logo:
    url: https://aaclub-sg-prod.s3.amazonaws.com/public/logo-dark.png
    altText: Atome
  description: '# Overview


    > ⚠ **Initial draft — version 1.** This is the **first version** of the partner white-label API spec. **Endpoints**, **field
    set**, **field semantics**, and **`required` flags** are **subject to change**, and will be **finalised case-by-case via
    the bilateral integration agreement** with each partner. Treat this document as a starting point, not a frozen contract.


    Draft **partner white-label** API under base path `servers`: **Auth–Capture–Void** checkout, optional **credit & installment
    checkout** (`/payment-precheck`, `/payment-plan`), **refunds**, **bills**, **transactions**, **repayment**, and partner-hosted
    **callbacks**. ---

    ## Go SDK


    Official Go client — source repository:


    **[atome-fin-go-sdk](https://github.com/atome-fin/atome-fin-go-sdk)** — `https://github.com/atome-fin/atome-fin-go-sdk`


    ---


    ## Auth–Capture–Void

    - **POST** `/auth`, `/capture`, `/voidAuth`: RSA2 signature on the JSON body (`Authorization` header); treat **`requestId`**
    as idempotent.

    - **Sync behaviour:** HTTP `200` on first submission may mean **processing** (`data.status = PROCESSING`). After a **terminal**
    state, the same POST retried with the same `requestId` returns **`SUCCESS` / `FAILED`** directly.

    - **Polling:** **GET** `/query-auth`, `/query-capture`, `/query-voidAuth` return the same envelope as the corresponding
    POST `200` for `requestId` + `externalReferenceUid`; sign the **GET** query string per the **signature** tag.

    - **Callbacks (Atome → partner):** `/<authNotifyUrl>` and `/<captureNotifyUrl>` fire **only** for **terminal** outcomes;
    they **never** carry `PROCESSING`.

    | Flow | Method | Path |

    | --- | --- | --- |

    | Hold / capture / void | POST | `/auth`, `/capture`, `/voidAuth` |

    | Poll same outcome | GET | `/query-auth`, `/query-capture`, `/query-voidAuth` |

    | Auth / capture result callback | POST | `/<authNotifyUrl>`, `/<captureNotifyUrl>` |

    ## Other modules (same specification file)

    Paths are ordered for readability: **HealthCheck** and **Credit** first, then **Payment** (checkout pricing & plan APIs,
    then Auth–Capture–Void and GET queries), followed by **Refund**, **Bill**, **Transaction**, **Repayment**, and remaining
    **Callback** routes (`/<refundNotifyUrl>`, `/repayment-callback`, `/account_change_callback`). Enable only what your integration
    contract covers.

    '
  version: partner-white-label-draft
  title: Partner White-Label API (Draft)
servers:
- url: https://id-api.apaylater.net/white-label/G
  description: '**Test (placeholder — align with gateway routing before go-live)**

    '
- url: https://id-api-pre.apaylater.net/white-label/G
  description: '**Pre-production (placeholder)**

    '
- url: https://api.atome.id/white-label/G
  description: '**Production (placeholder)**

    '
tags:
- name: change log
  description: '|  date | scope | change |

    | --- | --- | --- |

    | 2026-04-22 | All | Initial draft: Auth–Capture–Void (`/auth`, `/capture`, `/voidAuth`) and partner callbacks. |

    | 2026-05-06 | Scope | Expanded partner white-label spec: credit & checkout (pricing / pre-check / plan), refunds, bills,
    transactions, repayment, account callbacks. |'
- name: signature
  description: "We use RSA2(2048 bit) encryption algorithm, and through the exchange of public key certificate to verify the\
    \ signature. Encrypt the signature with salt if necessary,\nand in this condition we should exchange another public key\
    \ certificate.\n- ATOME provide:\n  - Public key certificate: The validity period is 3 year\n- Partner provide:\n  - Public\
    \ key certificate: The validity period is 3 year\n- Params:\n  - Request Headers: add param `Authorization`\n  - GET:\
    \ Sign the request parameters which parameter names are sorted in alphabetical natural order\n  - POST: Sign with the\
    \ payload.\n"
- name: HealthCheck
- name: Credit
- name: Payment
  description: '**Auth–Capture–Void:** Auth freezes limit; capture completes the order; void releases the hold. Partner must
    treat `requestId` as an idempotent key for every `/auth`, `/capture`, and `/voidAuth` request.

    **Installments / checkout:** Pricing, pre-check, payment plan, `/query-auth`, `/query-capture`, and `/query-voidAuth`
    use the same `Payment` tag; treat `requestId` as idempotent per integration rules for those paths.

    '
- name: Repayment
- name: Refund
  description: 'Asynchronously notify the final order result,  and notify the result by callback.</br>

    If the partner gets the final result before the callback, the callback will still be executed, the partner ensuring idempotency.</br>

    '
- name: Bill
- name: Transaction
- name: Callback
  description: 'Server-to-server notifications implemented on the **partner** side. Atome calls the partner-configured HTTPS
    URL **only when** `/auth` or `/capture` reaches a **terminal** `data.status` (e.g. `SUCCESS` or `FAILED`). While the synchronous
    API still shows **processing** (`PROCESSING`), Atome does **not** send these callbacks. After a terminal state is reached,
    the partner may also obtain the same terminal outcome via **idempotent** `/auth` / `/capture` retry (same `requestId`).

    '
