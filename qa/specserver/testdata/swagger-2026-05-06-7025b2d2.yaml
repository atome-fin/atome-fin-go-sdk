              type: string
            city:
              type: string
            district:
              type: string
            address:
              type: string
            zipCode:
              type: string
            village:
              type: string
        platformInformation:
          type: object
          description: User information on the partner platform.
          properties:
            userCreditScore:
              type: number
              format: double
              description: Partner-side credit score, decimal between 0 and 1.
            creditProfile:
              type: string
              description: 'JSON string carrying partner risk model scores and engineered features,

                e.g. `{"modelScores":[...],"features":[{"key":"...","value":"..."}]}`.

                '
