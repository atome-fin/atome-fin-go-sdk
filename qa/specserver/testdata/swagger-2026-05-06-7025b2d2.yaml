                  code:
                    type: string
                    description: '`PARAMS_MISSING`: Missing parameter<br/>

                      `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

                      `PARAMS_WRONG`: Wrong parameter, e.g. Inconsistent amounts;  Number of SKUs exceeds the maximum <br/>

                      `NOT_FOUND`: Data not found, e.g. User account does not exist  <br/>

                      '
                    enum:
                    - PARAMS_MISSING
                    - WRONG_PARAMS_FORMAT
                    - PARAMS_WRONG
                    - NOT_FOUND
                  message:
                    type: string
                    description: Failure message description
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
