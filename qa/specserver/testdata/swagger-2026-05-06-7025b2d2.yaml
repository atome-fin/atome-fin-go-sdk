components:
  requestBodies:
    AuthRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user in your system.
                maxLength: 64
              totalAmount:
                type: integer
                description: Total amount for the order, expressed in the smallest currency unit of the configured country
                  (IDR; smallest unit is Rupiah).
              periodType:
                type: integer
                description: Installment tenor for the order (e.g. 1, 3, 6, 9, or 12).
              subOrders:
                type: array
                description: Per-line split of `totalAmount` across sub-orders.
                items:
                  $ref: '#/components/schemas/SubOrder'
              extendInfo:
                type: object
                description: Optional extended fields for risk and fulfillment. `userCreditScore`, `deviceInfo`, `address`,
                  and `riskInfo` are all optional; send when available per integration agreement.
                properties:
                  userCreditScore:
                    type: number
                    format: double
                    description: Credit score between 0 and 1 (double); user-level signal when provided.
                  deviceInfo:
                    type: object
                    properties:
                      platform:
                        type: string
                        description: 'Example: ANDROID or IOS'
                      gps:
                        type: object
                        properties:
                          longitude:
                            type: string
                            description: 'Example: 137.2738282'
                          latitude:
                            type: string
                            description: 'Example: 24.2728888'
                          time:
                            description: 'Unix timestamp in milliseconds (example: 1620285931000).'
                      device:
                        type: object
                        properties:
                          utdid:
                            type: string
                            description: 'Example: d0e026336b6b9fe4d6216d5d53d07d11'
                          isRoot:
                            type: boolean
                            description: 'Example: true or false'
                          androidId:
                            type: string
                            description: 'Example: 65ee521bc1baa96c'
                          build:
                            type: object
                            properties:
                              board:
                                type: string
                                description: 'Example: STK-L22'
                              brand:
                                type: string
                                description: 'Example: HUAWEI'
                              cpuAbi:
                                type: string
                                description: 'Example: arm64-v8a'
                              device:
                                type: string
                                description: 'Example: HWSTK-HF'
                              manufacturer:
                                type: string
                                description: 'Example: HUAWEI'
                              model:
                                type: string
                                description: 'Example: STK-L22'
                              product:
                                type: string
                                description: 'Example: STK-L22'
                      wifiList:
                        type: array
                        items:
                          type: object
                          properties:
                            ssid:
                              type: string
                              description: 'Example: string'
                      ipAddress:
                        type: object
                        properties:
                          ethIp:
                            type: string
                            description: 'Example: 196.127.1.1'
                          trueIp:
                            type: string
                            description: 'Example: 196.127.1.1'
                  address:
                    type: object
                    properties:
                      shippingAddress:
                        type: object
                        properties:
                          state:
                            type: string
                          city:
                            type: string
                          district:
                            type: string
                          address1:
                            type: string
                          address2:
                            type: string
                      shippingName:
                        type: string
                        description: consignee's name
                      shippingPhoneNo:
                        type: string
                        description: consignee's mobile number
                  riskInfo:
                    $ref: '#/components/schemas/paymentRiskInfo'
            required:
            - requestId
            - externalReferenceUid
            - totalAmount
            - periodType
            - subOrders
    CaptureRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user in your system.
                maxLength: 64
              authOrderId:
                type: string
                description: Authorization reference returned in the `/auth` response.
                maxLength: 64
              totalAmount:
                type: integer
                description: Total amount to capture, expressed in the smallest currency unit of the configured country (IDR;
                  smallest unit is Rupiah). **Must equal** the `totalAmount` authorized by the corresponding `/auth` call;
                  uplift (capturing more than the authorized amount) is **not** allowed.
              periodType:
                type: integer
                description: Installment tenor; **must match** the value sent on the corresponding `/auth` request (e.g. 1,
                  3, 6, 9, or 12).
              subOrders:
                type: array
                description: Detailed price allocation for sub orders. The set of sub orders and their amounts **must match**
                  those sent in the corresponding `/auth` request; partial capture or re-allocation is **not** supported in
                  this version.
                items:
                  $ref: '#/components/schemas/SubOrder'
              extendInfo:
