        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /auth:
    post:
      tags:
      - Payment
      summary: Authorization (freeze credit)
      description: 'Partner sends this request to freeze limits on the user''s Atome account. Atome checks account status,
        credit line, and risk.

        If the check passes, limits are locked but not deducted; otherwise the authorization is rejected.


        **Synchronous response:**

        - **First submission (in-progress):** HTTP `200` acknowledges the request; `code` indicates acceptance while `data.status
        = PROCESSING`. The final outcome is delivered asynchronously via the callback.

        - **Idempotent retry after terminal state:** If the same `requestId` is resubmitted **after** processing has finished,
        the sync response directly carries the **terminal** result (`data.status = SUCCESS` or `FAILED`) — partners can safely
        poll via idempotent retry instead of waiting for the callback.


        **Callback (terminal only):** Atome invokes `/<authNotifyUrl>` **only after** `data.status` reaches a terminal value
        (`SUCCESS` or `FAILED`). **No callback** is sent for non-terminal / in-progress states, and callbacks **never** carry
        `PROCESSING`. Partner must handle callbacks **idempotently** (same `requestId` / `authOrderId` may be retried).

        '
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: RSA2 signature over the POST JSON body; see **signature** tag.
      - in: header
        name: sessionid
        required: true
        schema:
          type: string
          maxLength: 64
        description: Opaque session token for this checkout or authorization flow (max 64 characters).
      requestBody:
        $ref: '#/components/requestBodies/AuthRequest'
      responses:
        '200':
          description: 'Sync response. Inspect `code` and `data.status`:

            - `data.status = PROCESSING`: request accepted, still in progress — the final outcome arrives later via `/<authNotifyUrl>`
            (or can be re-fetched by idempotent retry with the same `requestId` after processing completes).

            - `data.status = SUCCESS` / `FAILED`: terminal result returned synchronously (typically via idempotent retry after
            the callback / processing has completed).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAckResponse'
        '400':
          description: PARAMS_MISSING、WRONG_PARAMS_FORMAT、PARAMS_WRONG、NOT_FOUND、SESSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStyle400Error'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /query-auth:
    get:
      tags:
      - Payment
      summary: query authorization result
      description: 'Idempotent read of the same outcome as `POST /auth` HTTP 200 for the given `requestId` and `externalReferenceUid`
        (terminal or in-progress). Sign the **GET** query string per the **signature** tag.

        '
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature. e.g. a=&b=&c=...
      - name: requestId
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: externalReferenceUid
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthAckResponse'
        '400':
          description: PARAMS_MISSING、WRONG_PARAMS_FORMAT、PARAMS_WRONG、NOT_FOUND、SESSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentStyle400Error'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /<authNotifyUrl>:
    post:
      tags:
      - Payment
      - Callback
      summary: Authorization result callback
      description: '**Partner-implemented** endpoint. Atome `POST`s here **only after** authorization reaches a **terminal**
        `data.status` in `AuthAckResponse` (same JSON shape as `/auth` HTTP 200). **Not** called for in-progress (`PROCESSING`)
        states—the synchronous `/auth` response covers processing.


        Callback body guarantees: `data.status` is **always** either `SUCCESS` or `FAILED`; it will **never** be `PROCESSING`
        in a callback.


        Replace `authNotifyUrl` with the HTTPS path agreed during integration (full base URL is configured per partner, not
        the Atome `servers` base above).

        '
      servers:
      - url: https://merchant.example.com/
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: RSA2 signature over the POST JSON body; same rules as **signature** for inbound partner calls.
      requestBody:
        $ref: '#/components/requestBodies/AuthCallbackRequest'
      responses:
        '200':
          description: 'Acknowledge receipt. Atome may retry the callback if a non-2xx response is returned (retry policy
            to be aligned with operations).

            '
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CallbackAckResponse'
        '400':
          description: Partner rejected payload (optional; prefer 200 with logged validation on partner side unless contract
            says otherwise).
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
  /capture:
    post:
      tags:
      - Payment
      summary: Capture (complete order)
      description: 'Partner uses this to complete the order. Atome validates capture amount and time window; if validation
        passes, a loan is generated for the user.


        **Synchronous response:**

        - **First submission (in-progress):** HTTP `200` acknowledges the request; `code` indicates acceptance while `data.status
        = PROCESSING`. The final capture outcome is delivered asynchronously via the callback.

