        application/json:
          schema:
            $ref: '#/components/schemas/RefundResult'
    PaymentPlanParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              externalReferenceUid:
                type: string
                description: reference id to the end user on the partner side
                maxLength: 64
              totalAmount:
                type: integer
                description: Total amount for the order. The minimum denomination in Indonesia is Rupiah (IDR).
              subOrders:
                type: array
                description: the detailed price allocation for sub orders
                items:
                  $ref: '#/components/schemas/PlanSubOrder'
              extendInfo:
                type: object
                description: all the extended information due to channel difference.
                properties:
                  originalLoanAmount:
                    type: number
                    description: original amount of the order
                  paymentType:
                    type: string
                    description: CREDIT_PAYMENT 、COMBINED_PAYMENT
                  ecommerceOrder:
                    $ref: '#/components/schemas/EcommerceOrder'
                  riskInfo:
                    $ref: '#/components/schemas/paymentPlanRiskInfo'
                required:
                - paymentType
            required:
            - externalReferenceUid
            - totalAmount
            - subOrders
    RefundParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                description: Partner-side idempotent request identifier (max 64 chars).
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user.
                maxLength: 64
              captureRequestId:
                type: string
                description: |
                  `requestId` of the original `POST /capture` call that created the loan being refunded.
                  Use the same value the partner sent on capture; refund is always issued against a captured order.
                maxLength: 64
              refundAmount:
                type: integer
                description: Total refund amount for the order. The minimum denomination in Indonesia is Rupiah (IDR).
              subOrders:
                type: array
                items:
                  $ref: '#/components/schemas/SubOrderRefundRequest'
              extendInfo:
                type: object
                description: all the extended information due to channel difference
            required:
            - requestId
            - externalReferenceUid
            - captureRequestId
            - refundAmount
            - subOrders
    RepaymentParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: reference id to the end user on the partner side
                maxLength: 64
              repaymentAmount:
                type: integer
                description: total repayment amount .The minimum denomination in Indonesia is Rupiah (IDR).
              repaymentApplyTime:
                type: integer
                description: Timestamp(unix millisecond)
              extendInfo:
                type: object
                description: all the extended information due to channel difference
            required:
            - requestId
            - externalReferenceUid
            - repaymentAmount
            - repaymentApplyTime
  schemas:
    CurrencyCode:
      type: string
      description: Currency code per [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html). Currently only `IDR` is
        supported.
      enum:
      - IDR
      example: IDR
    CallbackAckResponse:
      type: object
      description: Body your endpoint returns to acknowledge a callback.
      properties:
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          description: Human-readable acknowledgement text.
      required:
      - code
      - message
    AuthAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`SUCCESS`: Request accepted. Business outcome lives in `data.status` — on first submission it is typically
            `PROCESSING` (terminal result via callback); on idempotent retry after completion it is `SUCCESS` / `FAILED`.<br/>

            `INVALID_ORDER_AMOUNT`: The order amount is less than the minimum installable amount or greater than the maximum
            installable amount<br/>

            `CREDIT_APPLICATION_NOT_APPROVED`: User''s application for credit was not approved<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: The account is blocked due to overdue bills<br/>

            `ACCOUNT_BLOCKED`: The account is blocked due to risk or compliance reasons<br/>

            `ACCOUNT_TEMP_BLOCKED`: The account is temporarily blocked<br/>

            `FEE_CHANGE`: The fee configuration has changed since the quote used by the partner; re-fetch the latest fee/plan
            before retrying.<br/>

            '
          enum:
          - SUCCESS
          - INVALID_ORDER_AMOUNT
          - CREDIT_APPLICATION_NOT_APPROVED
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
          - ACCOUNT_TEMP_BLOCKED
          - FEE_CHANGE
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/AuthAuthorizationData'
    AuthAuthorizationData:
      type: object
      description: Payload under `data` while authorization is processed or completed; additional optional fields may appear
        when processing finishes.
      required:
      - requestId
      - currency
      - authOrderId
      - totalAmount
      - status
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        authOrderId:
          type: string
          description: Authorization identifier for this hold; use on `/capture` and `/voidAuth`.
        totalAmount:
          type: integer
          description: Total amount for the order, expressed in the smallest currency unit of the configured country (IDR;
            smallest unit is Rupiah).
        status:
          type: string
          description: Business status of the authorization.
          enum:
          - PROCESSING
          - SUCCESS
          - FAILED
        failureCode:
          type: string
          description: 'Present when `status` is `FAILED`, for example `USER_CREDIT_LIMIT_INSUFFICIENT`.

            '
          enum:
          - USER_CREDIT_LIMIT_INSUFFICIENT
          - RISK_REJECT
        subOrderInstallmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/SubOrderInstallmentPlans'
        accountChanges:
          $ref: '#/components/schemas/AccountChanges'
        extendInfo:
          type: object
          properties:
            agreementUrl:
              type: string
    CaptureAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`SUCCESS`: Capture successful<br/>

            Additional business codes may appear in HTTP 200 responses when applicable.

            '
          enum:
          - SUCCESS
          - INVALID_ORDER_AMOUNT
          - CREDIT_APPLICATION_NOT_APPROVED
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
          - FEE_CHANGE
          - USER_CREDIT_LIMIT_INSUFFICIENT
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/CaptureResultData'
    CaptureResultData:
      allOf:
      - $ref: '#/components/schemas/PaymentResult'
      - type: object
        required:
        - authOrderId
        properties:
          authOrderId:
            type: string
            description: Authorization identifier from the preceding `/auth` call.
    VoidAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/VoidResultData'
    VoidResultData:
      type: object
      required:
      - requestId
      - externalReferenceUid
      - authOrderId
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        externalReferenceUid:
          type: string
          maxLength: 64
          description: Partner-side stable identifier for the end user.
        authOrderId:
          type: string
          description: Authorization identifier that was voided.
        accountChanges:
          $ref: '#/components/schemas/AccountChanges'
    PaymentStyle400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `PARAMS_WRONG`: Wrong parameter, e.g. inconsistent amounts or too many sub-order lines<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            `SESSION_NOT_FOUND`: The session is not started or invalid<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - PARAMS_WRONG
          - NOT_FOUND
          - SESSION_NOT_FOUND
        message:
          type: string
          description: Human-readable error detail.
    Capture400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `PARAMS_WRONG`: Wrong parameter, e.g. inconsistent amounts or too many sub-order lines<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            `CAPTURE_AMOUNT_EXCEED`: Capture amount out of range<br/>

            `AUTH_EXPIRED`: Capture exceeds the time limit<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - PARAMS_WRONG
          - NOT_FOUND
          - CAPTURE_AMOUNT_EXCEED
          - AUTH_EXPIRED
        message:
          type: string
          description: Human-readable error detail.
    Void400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - NOT_FOUND
        message:
          type: string
          description: Human-readable error detail.
    InstallmentDetail:
      type: object
      properties:
        subOrderId:
          type: string
          description: Sub-order identifier; must match `subOrders[].subOrderId` from the request.
          maxLength: 64
        totalTenor:
          type: integer
          description: Total number of installments for this segment.
        currentTenor:
          type: integer
          description: Current installment index within `totalTenor`.
        repayAmount:
          type: integer
          description: Principal plus interest due for this installment (smallest currency unit).
        principalAmount:
          type: integer
          description: Principal portion for this installment (smallest currency unit).
        interestAmount:
          type: integer
          description: Interest portion for this installment (smallest currency unit).
        billId:
          type: string
          description: Billing period identifier (`yyyyMM`).
        billDate:
          type: string
          description: Bill date (`yyyy-MM-dd`).
        dueDate:
          type: string
          description: Repayment due date (`yyyy-MM-dd`).
      required:
      - subOrderId
      - totalTenor
      - currentTenor
      - repayAmount
      - principalAmount
      - interestAmount
      - billId
      - billDate
      - dueDate
    InstallmentPlan:
      type: object
      properties:
        totalTenor:
          type: integer
          description: Total number of installments for this plan.
        orderRepayAmount:
          type: integer
          description: Total principal plus interest for the plan (smallest currency unit).
        orderInterestAmount:
          type: integer
          description: Total interest for the plan (smallest currency unit).
        installmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDetail'
      required:
      - totalTenor
      - installmentDetails
      - orderRepayAmount
      - orderInterestAmount
    SubOrderInstallmentPlans:
      type: object
      properties:
        subOrderId:
          type: string
          description: Sub-order identifier; must match `subOrders[].subOrderId` from the `/auth` or `/capture` request.
          maxLength: 64
        orderAmount:
          type: integer
          description: Principal amount for this sub-order (smallest currency unit).
        installmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/InstallmentPlan'
      required:
      - subOrderId
      - orderAmount
      - installmentPlans
    SubOrder:
      type: object
      description: 'Line item under the parent order (amount split across sub-orders).

        **`subOrderId`**, **`amount`**, and **`quantity`** are required. Whether **`skuId`** and other catalog fields must
        be sent is **agreed during partner integration**; omit them when your integration does not use them.

        '
      properties:
        periodType:
          type: integer
          description: Installment tenor for this line item (e.g. 1, 3, 6, 9, or 12).
        subOrderId:
          type: string
          description: Stable sub-order identifier for this line item; use the same value across `/auth`, `/capture`, callbacks,
            and reconciliation.
          maxLength: 64
        skuId:
          type: string
          description: Product SKU identifier. Optional in this specification; **whether it is mandatory for your integration
            is agreed during partner integration**—confirm with your Atome contact before go-live.
          maxLength: 64
        creatorId:
          type: string
          description: Creator or influencer identifier, when applicable.
        skuName:
          type: string
          description: Human-readable SKU name.
        spuId:
          type: string
          description: Standard product unit (SPU) identifier.
        categoryId:
          type: string
          description: Product category identifier.
          maxLength: 128
        categoryOneName:
          type: string
          description: Primary category label at SKU level.
          maxLength: 128
        categoryCodes:
          type: array
          description: 'Category codes for this line item (example: `DIGITAL`, `MOBILE_TABLET`, `OTHER_ELECTRONICS`). Multiple
            values allowed.'
          items:
            type: string
        quantity:
          type: integer
          minimum: 1
          description: Number of units for this line item; must be a positive integer.
        amount:
          type: integer
          description: Line item total amount, in the smallest currency unit of the configured country (IDR; smallest unit
            is Rupiah).
        originalAmount:
          type: number
          description: Original list amount for the line item before discounts, when provided.
        merchantId:
          type: string
          description: Merchant identifier for settlement or routing.
        extendInfo:
          type: object
          description: Optional extension fields for this line item.
      required:
      - subOrderId
      - amount
      - quantity
    AccountChanges:
      description: 'Account balance or status impact returned with an API response.<br/>

        '
      type: object
      properties:
        externalReferenceUid:
          type: string
          description: Partner-side stable identifier for the end user in your system.
          maxLength: 64
        previousStatus:
          type: string
          description: 'Original status of account<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

            `ACCOUNT_BLOCKED`: Risk block<br/>

            '
          enum:
          - NORMAL
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
        currentStatus:
          type: string
          description: 'Current status of account<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

            `ACCOUNT_BLOCKED`: Risk block<br/>

            `ACCOUNT_CLOSED`: Account closed<br/>

            '
          enum:
          - NORMAL
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
          - ACCOUNT_CLOSED
        totalCreditChange:
          type: integer
          description: Change in total credit limit (smallest currency unit).
        usedCreditChange:
          type: integer
          description: Change in used credit (smallest currency unit).
        frozenCreditChange:
          type: integer
          description: Change in frozen credit from authorization hold (smallest currency unit).
        availableCreditChange:
          type: integer
          description: Change in available credit (smallest currency unit).
        overpaidAmountChange:
          type: integer
          description: Change in overpaid balance (smallest currency unit).
        lateFeeAmountChange:
          type: integer
          description: Change in late fee balance (smallest currency unit).
        interestAmountChange:
          type: integer
          description: Change in interest balance (smallest currency unit).
        version:
          type: integer
          description: 'Monotonic version or event time in Unix milliseconds (example: 1623052669233).'
      required:
      - externalReferenceUid
      - version
    PaymentResult:
      type: object
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        orderId:
          type: string
          maxLength: 32
          description: Order identifier returned by Atome.
        totalAmount:
          type: integer
          description: Total amount for the order, expressed in the smallest currency unit of the configured country (IDR;
            smallest unit is Rupiah).
        status:
          type: string
          description: 'Business status of the operation.<br/>

            Synchronous `/auth` / `/capture` responses may return any of `PROCESSING`, `SUCCESS`, `FAILED` — `PROCESSING`
            on first submission while work is in progress, and `SUCCESS` / `FAILED` either once the work has completed (idempotent
            retry with the same `requestId`) or when the decision can be made inline.<br/>

            Callbacks (`/<authNotifyUrl>`, `/<captureNotifyUrl>`) are sent **only** at terminal states and always carry `SUCCESS`
            or `FAILED`; they **never** carry `PROCESSING`.

            '
          enum:
          - PROCESSING
          - FAILED
          - SUCCESS
        failureCode:
          type: string
          description: '`USER_CREDIT_LIMIT_INSUFFICIENT`: User''s credit account limit is insufficient <br/>

            `RISK_REJECT`: Risk control audit rejected <br/>

            '
          enum:
          - USER_CREDIT_LIMIT_INSUFFICIENT
          - RISK_REJECT
        subOrderInstallmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/SubOrderInstallmentPlans'
        accountChanges:
          allOf:
          - $ref: '#/components/schemas/AccountChanges'
          description: '`status=FAILED`: Only account state changes occur in the `accountChanges` structure when the terminal
            state is `FAILED`.<br/>

            `status=SUCCESS`: Only account credit changes occur in the `accountChanges` structure when the terminal state
            is `SUCCESS`.<br/>

            '
        extendInfo:
          type: object
          properties:
            reapplyTime:
              type: integer
              description: 'Unix timestamp in milliseconds when the user may reapply (example: 1623052669233).'
            agreement:
              type: object
              properties:
                agreementUrl:
                  type: string
                  description: Loan agreement URL when available; typically returned only after capture succeeds (e.g. in
                    `/<captureNotifyUrl>` or a synchronous terminal `/capture` response), not while `status` is `PROCESSING`.
      required:
      - requestId
      - orderId
      - status
      - totalAmount
      - currency
    paymentRiskInfo:
      type: object
      description: Optional channel-specific risk payload when agreed in integration.
    AuthorizationErrorResponse:
      type: object
      description: 'Standard error envelope for signature or authentication failures.

        '
      properties:
        code:
          type: string
          description: '`INVALID_SIGNATURE`: Invalid signature<br/>

            '
          enum:
          - INVALID_SIGNATURE
        message:
          type: string
          description: Human-readable error detail.
      required:
      - code
      - message
    ServerErrorResponse:
      type: object
      description: Server error response format.
      properties:
        code:
          type: string
          description: '**List of all possible error codes.** <br/>

            `SERVER_ERROR`: server error; you can try again. Retry up to three times before giving up.<br/>

            '
          enum:
          - SERVER_ERROR
        message:
          type: string
          description: Human-readable error detail.
      required:
      - code
      - message
    CreditChangeHistoryResponse:
      type: object
      description: 'credit&balance change history '
      properties:
        externalReferenceUid:
          type: string
          maxLength: 64
          description: Partner-side stable identifier for the end user.
        type:
          type: string
          description: 'Scenario of account change<br/>

            `OVERPAID_CHANGE`:change of overpaid amount<br/>

            `CREDIT_LIMIT_ADJUSTMENT`:change of credit limit<br/>

            `TRADE_AVAILABLE_CREDIT_CHANGE`:change of available credit limit caused by trade<br/>

            '
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        recordInfo:
          type: array
          items:
            $ref: '#/components/schemas/RecordInfo'
        paginator:
          type: object
          properties:
            start:
              type: integer
            count:
              type: integer
            totalCount:
              type: integer
      required:
      - externalReferenceUid
      - type
      - currency
    RecordInfo:
      type: object
      description: 'credit change history serial info '
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        changeAmount:
          type: string
          description: Net change amount (smallest currency unit).
        event:
          type: string
          description: 'Account notification event.<br/>

            `PAYMENT`: Payment<br/>

            `REPAYMENT`: Repayment<br/>

            `REFUND`: Refund<br/>

            `REPAYMENT_ATOME`: Atome channels for repayment<br/>

            `OVERPAID_REPAYMENT`: Repayment<br/>

            `FIXED_CREDIT_LIMIT_BOOST`: Risk control actively adjusts the fixed amount<br/>

            `FIXED_CREDIT_LIMIT_DECREASE`: Risk control actively adjusts the fixed amount<br/>

            `TEMP_CREDIT_LIMIT_BOOST`: Temporary quota adjustment<br/>

            `TEMP_CREDIT_LIMIT_DECREASE`: Temporary quota adjustment<br/>

            `CREDIT_APPLICATION`: Credit approved, produce the initial credit limit<br/>

            '
        validTil:
          type: integer
          description: Unix timestamp (ms) until which this record is valid.
        time:
          type: integer
          description: Event time (Unix milliseconds).
    RepaymentResult:
      type: object
      description: 'repayment result '
      properties:
        requestId:
          type: string
          description: The partner provides this requestId, and Atome will generate a 31-bit pure numeric string if necessary.
        repaymentId:
          type: string
          description: Repayment identifier returned by Atome.
        status:
          type: string
          description: Code `PROCESSING` occurs only in the query repayment result and apply to repayment; The refund callback
            will only return `SUCCESS` or `FAILED`
          enum:
          - PROCESSING
          - SUCCESS
          - FAILED
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        repaymentAmount:
          type: integer
          description: total repayment amount .The minimum denomination in Indonesia is Rupiah (IDR).
        repaymentTime:
          type: integer
          description: Timestamp(unix millisecond)
        event:
          type: string
          description: '`NORMAL`: The user initiates repayment through the partner<br/>

            `ATOME_REPAYMENT`: The user initiates repayment through the ATOME channel.<br/>

            `OVERPAID_REPAYMENT`: The repayment use overpaid balance, triggered by ATOME.<br/>

            '
          enum:
          - NORMAL
          - ATOME_REPAYMENT
          - OVERPAID_REPAYMENT
        accountChanges:
          $ref: '#/components/schemas/CommerceAccountChanges'
        extendInfo:
          type: object
          properties:
            settlement:
              type: object
              properties:
                payableSubsidyAmount:
                  type: integer
                  description: coupon consumed amount due to repayment. The minimum denomination in Indonesia is Rupiah (IDR).
              required:
              - payableSubsidyAmount
      required:
      - requestId
      - repaymentId
      - status
      - currency
    AccountNotification:
      type: object
      description: account change callback
      properties:
        callbackRequestId:
          type: string
          description: The idempotent ID of the account notification, atome generate
          maxLength: 32
        externalReferenceUid:
          type: string
          description: reference id to the end user on the partner side
          maxLength: 64
        externalRequestId:
          type: string
          description: 'Biz reference request id. <br/>

            if `creditLimitAdjustmentReason=CIRCLED_LIST_CREDIT_BOOST` externalRequestId is the partner''s requestId <br/>

            '
          maxLength: 64
        event:
          type: string
          description: 'Account notification event.<br/>

            `ACCOUNT_OVERDUE`: User account overdue <br/>

            `LATE_FEE_INCREASE`: Late fee increase<br/>

            `LATE_FEE_DECREASE`: Late fee decrease<br/>

            `FIXED_CREDIT_LIMIT_BOOST`: Risk control actively adjusts the fixed amount<br/>

            `FIXED_CREDIT_LIMIT_DECREASE`: Risk control actively adjusts the fixed amount<br/>

            `TEMP_CREDIT_LIMIT_BOOST`: Temporary quota adjustment<br/>

            `TEMP_CREDIT_LIMIT_DECREASE`: Temporary quota adjustment. Now only used to temp limit invalid.<br/>

            `ATOME_CONTROL`: The user''s credit account status has changed due to ATOME control.<br/>

            '
          enum:
          - ACCOUNT_OVERDUE
          - LATE_FEE_INCREASE
          - LATE_FEE_DECREASE
          - FIXED_CREDIT_LIMIT_BOOST
          - FIXED_CREDIT_LIMIT_DECREASE
          - TEMP_CREDIT_LIMIT_BOOST
          - TEMP_CREDIT_LIMIT_DECREASE
          - ATOME_CONTROL
        scene:
          type: string
          description: 'Scenario of account change<br/>

            `ACCOUNT_STATUS_CHANGE`:user account status change<br/>

            `LATE_FEE_CHANGE`:change of late fee amount<br/>

            `CREDIT_LIMIT_ADJUSTMENT`:change of credit limit<br/>

            '
          enum:
          - ACCOUNT_STATUS_CHANGE
          - LATE_FEE_CHANGE
          - OVERPAID_CHANGE
          - CREDIT_LIMIT_ADJUSTMENT
        previousStatus:
          type: string
          description: 'Original status of account<br/>

            Only occurs when the state changes<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

            `ACCOUNT_BLOCKED`: Risk block<br/>

            '
          enum:
          - NORMAL
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
        currentStatus:
          type: string
          description: 'Final status of account<br/>

            Only occurs when the state changes<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

