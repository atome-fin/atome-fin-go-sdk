paths:
  /heart-beat:
    get:
      tags:
      - HealthCheck
      summary: Monitoring the health status of the service
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: 'result code<br />

                      `SUCCESS`：The service is in good condition.<br/>

                      '
                    enum:
                    - SUCCESS
                  message:
                    type: string
                  data:
                    type: object
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /credit-information:
    post:
      tags:
      - Credit
      summary: Submit credit information
      description: 'Lightweight first step of the credit flow: tell Atome the partner-side user identity,

        country and event type (new / rejected / switch). The full KYC payload is then sent

        via `POST /credit-application`.

        '
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - in: header
        name: Encrypt
        required: true
        schema:
          type: string
        description: 'Store the AES key after RSA public key encryption. </br>

          format: `symmetricKey=aeskey ciphertext`

          '
      requestBody:
        $ref: '#/components/requestBodies/CreditInformation'
      responses:
        '200':
          description: SUCCESS,ACTIVE_ACCOUNT,CREDIT_APPLICATION_INPROGESS
          content:
            application/json:
              schema:
                type: object
                description: Credit information submit response
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                    - ACTIVE_ACCOUNT
                    - CREDIT_APPLICATION_INPROGESS
                  message:
                    type: string
                    description: success or fail message
                  data:
                    $ref: '#/components/schemas/CreditInformationResult'
        '400':
          description: PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT、INVALID_ENCRYPTION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /credit-application:
    post:
      tags:
      - Credit
      summary: Submit credit application
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - in: header
        name: Encrypt
        required: true
        schema:
          type: string
        description: 'Store the AES key after RSA public key encryption. </br>

          format: `symmetricKey=aeskey ciphertext`

          '
      requestBody:
        $ref: '#/components/requestBodies/CreditApplication'
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                description: Result of credit application.
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: success or fail message
                  data:
                    $ref: '#/components/schemas/CreditApplicationResult'
        '400':
          description: PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT、INVALID_ENCRYPTION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /credit-result:
    get:
      tags:
      - Credit
      summary: Get credit result
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - name: externalReferenceUid
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                description: Result of credit application
                properties:
                  code:
                    type: string
                    description: 'result code<br />

                      `SUCCESS`：get credit result successfully<br/>

                      '
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: success or fail message
                  data:
                    $ref: '#/components/schemas/CreditApplicationResult'
        '400':
          description: PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT、NO_CREDIT_APPLICATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /credit-information-result:
    get:
      tags:
      - Credit
      summary: Get credit information result
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - name: externalReferenceUid
        in: query
        required: true
        schema:
          type: string
      - name: requestId
        in: query
        required: true
        schema:
          type: string
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                description: Result of credit information collect
                properties:
                  code:
                    type: string
                    description: 'result code<br />

                      `SUCCESS`：get credit information collect result successfully<br/>

                      '
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: success or fail message
                  data:
                    $ref: '#/components/schemas/CreditApplicationCollectQueryResult'
        '400':
          description: PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT、NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /<creditInformationNotifyUrl>:
    post:
      tags:
      - Credit
      - Callback
      summary: Submit credit information result callback
      requestBody:
        $ref: '#/components/requestBodies/CreditCollectResult'
      responses:
        '200':
          description: we will retry callback 14 times if we get non-200 response.
          content:
            application/json:
              schema:
                type: object
                description: Acknowledgement payload returned by Atome.
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: success or fail message
  /<creditApplicationNotifyUrl>:
    post:
      tags:
      - Credit
      - Callback
      summary: Submit credit application result callback
      requestBody:
        $ref: '#/components/requestBodies/CreditResult'
      responses:
        '200':
          description: we will retry callback 14 times if we get non-200 response.
          content:
            application/json:
              schema:
                type: object
                description: Acknowledgement payload returned by Atome.
                properties:
                  code:
                    type: string
                    enum:
                    - SUCCESS
                  message:
                    type: string
                    description: success or fail message
  /query-balance-history:
    get:
      tags:
      - Credit
      summary: Query credit & balance change history
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - name: externalReferenceUid
        in: query
        required: true
        schema:
          type: string
          maxLength: 64
      - name: type
        in: query
        required: true
        description: 'Scenario of account change<br/>

          `OVERPAID_CHANGE`:change of overpaid amount<br/>

          `CREDIT_LIMIT_ADJUSTMENT`:change of credit limit<br/>

          `TRADE_AVAILABLE_CREDIT_CHANGE`:change of available credit limit caused by trade<br/>

          '
        schema:
          type: string
      - name: requestId
        in: query
        required: false
        schema:
          type: string
          maxLength: 64
      - name: start
        in: query
        schema:
          type: integer
          description: default 1
      - name: count
        in: query
        schema:
          type: integer
          description: default 10, max 50
      responses:
        '200':
          description: 'SUCCESS

            '
          content:
            application/json:
              schema:
                type: object
                description: Result of query-balance-history
                properties:
                  code:
                    type: string
                    description: 'result code<br/>

                      `SUCCESS`：Modified successfully<br/>

                      `CREDIT_APPLICATION_NOT_APPROVED`: User''s application for credit was not approved<br/>

                      `ACCOUNT_CLOSED`: Account has been closed<br/>

                      '
                    enum:
                    - SUCCESS
                    - CREDIT_APPLICATION_NOT_APPROVED
                    - ACCOUNT_CLOSED
                  message:
                    type: string
                    description: success or fail message
                  data:
                    $ref: '#/components/schemas/CreditChangeHistoryResponse'
        '400':
          description: NOT_FOUND、PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /modify-application-info:
    post:
      tags:
      - Credit
      summary: Modify application info
      description: It can only be requested when the credit application is approved.
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      requestBody:
        $ref: '#/components/requestBodies/CreditApplicationChange'
      responses:
        '200':
          description: 'SUCCESS、CREDIT_APPLICATION_NOT_APPROVED<br/>

            ps: credit application Status changes are notified by ''account change messages''.<br/>

            '
          content:
            application/json:
              schema:
                type: object
                description: Result of modify-application-info
                properties:
                  code:
                    type: string
                    description: 'result code<br/>

                      `SUCCESS`：Modified successfully<br/>

                      `CREDIT_APPLICATION_NOT_APPROVED`：The application for credit has not been approved<br/>

                      '
                    enum:
                    - SUCCESS
                    - CREDIT_APPLICATION_NOT_APPROVED
                  message:
                    type: string
                    description: success or fail message
        '400':
          description: NOT_FOUND、PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT、NO_CREDIT_APPLICATION
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /close-account:
    post:
      tags:
      - Credit
      summary: close account
      description: Close the partner-side account on Atome.
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                requestId:
                  type: string
                externalReferenceUid:
                  type: string
              required:
              - requestId
              - externalReferenceUid
      responses:
        '200':
          description: 'SUCCESS、UNPAID_DEBT、OVERPAID_UNRETURNED、ACTIVE_ACCOUNT、FAILED <br/>

            ps: The change of credit application status caused by account cancellation is notified by "account change message".
            <br/>

            '
          content:
            application/json:
              schema:
                type: object
                description: Result of close account
                properties:
                  code:
                    type: string
                    description: 'result code<br/>

                      `SUCCESS`: close account successfully<br/>

                      `UNPAID_DEBT`: this account can''t be close because it still has outstanding bills.<br/>

                      `OVERPAID_UNRETURNED`: this account still has overpaid amount.<br/>

                      `ACTIVE_ACCOUNT`: there are still orders in processing for this account.<br/>

                      `USER_ACCOUNT_NOT_EXIST`: Credit application failed.<br/>

                      `ONGOING_WITHDRAWAL`: this account has ongoing withdrawal.<br/>

                      `FAILED`: Other failures.<br/>

                      '
                    enum:
                    - SUCCESS
                    - UNPAID_DEBT
                    - OVERPAID_UNRETURNED
                    - ACTIVE_ACCOUNT
                    - FAILED
                    - USER_ACCOUNT_NOT_EXIST
                    - ONGOING_WITHDRAWAL
                  message:
                    type: string
                    description: success or fail message
        '400':
          description: NOT_FOUND、PARAMS_MISSING、PARAMS_WRONG、WRONG_PARAMS_FORMAT
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /payment-precheck:
    post:
      tags:
      - Payment
      summary: precheck credit line and status
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                externalReferenceUid:
                  type: string
                  description: reference id to partner user
                  maxLength: 64
                totalAmount:
                  type: integer
                  description: total amount for the order
                subOrders:
                  type: array
                  description: the detailed price allocation for sub orders
                  items:
                    $ref: '#/components/schemas/PaymentPreCheckSubOrder'
                extendInfo:
                  type: object
                  description: all the extended information due to channel difference.
                  properties:
                    paymentType:
                      type: string
                      description: CREDIT_PAYMENT 、COMBINED_PAYMENT
                    sceneCode:
                      type: string
                      description: PRELOAD
              required:
              - externalReferenceUid
              - totalAmount
              - subOrders
              - event
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                description: Acknowledgement payload returned by Atome.
                properties:
                  code:
                    type: string
                    description: '`SUCCESS`: Success.<br/>

                      `CREDIT_APPLICATION_NOT_APPROVED`: User''s application for credit was not approved<br/>

                      '
                    enum:
                    - SUCCESS
                    - CREDIT_APPLICATION_NOT_APPROVED
                  message:
                    type: string
                    description: success or fail message
                  data:
                    type: object
                    properties:
                      creditIsSufficient:
                        type: boolean
                        description: 'true: user has enough credit to pay the order.<br/>

                          false: user has not enough credit to pay the order.

                          '
                      totalCredit:
                        type: integer
                        description: 'fix credit + temp credit. note: don''t include shadow credit.<br/>

                          Total credit line. The minimum denomination in Indonesia is Rupiah (IDR).'
                      availableCredit:
                        type: integer
                        description: "user payment availableCredit, if shadow credit is available, will include shadow available\
                          \ credit. It's possible that the availableCredit is greater than totalCredit.<br/> \nit is different\
                          \ from /credit-result interface's creditInfo.availableCredit<br/>\nAvailable credit line. The minimum\
                          \ denomination in Indonesia is Rupiah (IDR).\n"
                      limitDetails:
                        type: array
                        items:
                          type: object
                          properties:
                            limitType:
                              type: string
                              enum:
                              - PERMANENT_LIMIT
                              - TEMPORARY_LIMIT
                              - SHADOW_LIMIT
                            totalCredit:
                              type: integer
                              description: "Total credit line. if limitType is `SHADOW_LIMIT` return null.<br/> \nThe minimum\
                                \ denomination in Indonesia is Rupiah (IDR).\n"
                            availableCredit:
                              type: integer
                              description: "Available credit line. Min value is 0, if user overused, will return 0.<br/> \n\
                                The minimum denomination in Indonesia is Rupiah (IDR).\n"
                          required:
                          - totalCredit
                          - availableCredit
                          - limitType
                      currency:
                        type: string
                        description: IDR
                        enum:
                        - IDR
                      version:
                        type: integer
                        description: Timestamp in unix milliseconds, i.e. 1623052669233
                    required:
                    - creditIsSufficient
                    - totalCredit
                    - availableCredit
                    - currency
                    - version
                    - limitDetails
        '400':
          description: PARAMS_MISSING、WRONG_PARAMS_FORMAT、PARAMS_WRONG、NOT_FOUND
          content:
            application/json:
              schema:
                type: object
                properties:
                  code:
                    type: string
                    description: '`PARAMS_MISSING`: Missing parameter<br/>

                      `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

                      `PARAMS_WRONG`: Wrong parameter, e.g. Inconsistent amounts;  Number of SKUs exceeds the maximum <br/>

                      `NOT_FOUND`: Data not found, e.g. User account does not exist  <br/>

                      '
                    enum:
                    - PARAMS_MISSING
                    - WRONG_PARAMS_FORMAT
                    - PARAMS_WRONG
                    - NOT_FOUND
                  message:
                    type: string
                    description: Failure message description
        '401':
          description: INVALID_SIGNATURE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthorizationErrorResponse'
        '500':
          description: SERVER_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServerErrorResponse'
  /payment-plan:
    post:
      tags:
      - Payment
      summary: Installment payment plan
      parameters:
      - in: header
        name: Authorization
        required: true
        schema:
          type: string
        description: Request parameter signature.
      - in: header
        name: sessionid
        required: true
        schema:
          type: string
          maxLength: 64
        description: Request session id.
      requestBody:
        $ref: '#/components/requestBodies/PaymentPlanParam'
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                description: Acknowledgement payload returned by Atome.
                properties:
                  code:
                    type: string
                    description: '`INVALID_ORDER_AMOUNT`: The order amount is less than the minimum installable amount or
                      greater than the maximum installable amount <br/>

                      `USER_CREDIT_LIMIT_INSUFFICIENT`: User''s credit account limit is insufficient<br/>

                      `CREDIT_APPLICATION_NOT_APPROVED`: User''s application for credit was not approved<br/>

                      `ACCOUNT_BLOCKED_OVERDUE`: Account is blocked due to overdue bills.<br/>

                      `ACCOUNT_BLOCKED`: Account is blocked due to risk or compliance reasons.<br/>

                      `RISK_REJECT`: Risk control audit rejected.<br/>

                      '
                    enum:
                    - SUCCESS
                    - INVALID_ORDER_AMOUNT
                    - USER_CREDIT_LIMIT_INSUFFICIENT
                    - CREDIT_APPLICATION_NOT_APPROVED
                    - ACCOUNT_BLOCKED_OVERDUE
                    - ACCOUNT_BLOCKED
                    - RISK_REJECT
                  message:
