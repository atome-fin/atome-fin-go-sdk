    CreditInformation:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                description: Partner-side idempotent request identifier (max 64 chars).
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user.
                maxLength: 64
              mobileNumber:
                type: string
                description: Mobile phone number with the dialling code prefix, e.g. `+62XXXXXXXXXXX`.
              email:
                type: string
                maxLength: 64
                description: User's email address.
              country:
                type: string
                description: 'User''s country (ISO-style market code).<br/>

                  `ID`: Indonesia<br/>

                  '
                enum:
                - ID
              applicationEssentialInfo:
                type: object
                description: Essential application fields collected at the credit information step.
                required:
                - individualProfile
                properties:
                  individualProfile:
                    type: object
                    description: KYC profile of the end user.
                    required:
                    - ocrResult
                    properties:
                      ocrResult:
                        type: object
                        description: OCR-extracted fields from the ID document.
                        required:
                        - fullName
                        properties:
                          fullName:
                            type: string
                            description: Full legal name as printed on the ID.
              extendInfo:
                type: object
                description: Extended fields agreed per integration.
                properties:
                  language:
                    type: string
                    description: Display language for the Atome-hosted information collection page. Optional; defaults to `id` when omitted.
                    enum:
                    - en
                    - id
                    default: id
            required:
            - requestId
            - externalReferenceUid
            - mobileNumber
            - email
            - country
            - applicationEssentialInfo
          examples:
            ID:
              summary: Indonesia request body example
              value:
                requestId: R897321804
                externalReferenceUid: E897321804
                mobileNumber: '+628129801929'
                email: xxx@xxx.com
                country: ID
                applicationEssentialInfo:
                  individualProfile:
                    ocrResult:
                      fullName: Luna Zhang
                extendInfo:
                  language: id
    CreditApplicationChange:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                description: Partner-side idempotent request identifier (max 64 chars).
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user.
                maxLength: 64
              mobileNumber:
                type: string
                description: Mobile phone number with the dialling code prefix, e.g. `+62159XXXXXXXX`.
              email:
                type: string
                maxLength: 64
                description: Optional updated email address.
              extendInfo:
                type: object
                description: Extended fields that may be agreed per integration.
                properties:
                  language:
                    type: string
                    description: Display language for any partner-rendered UI follow-ups.
                    enum:
                    - en
                    - id
            required:
            - requestId
            - externalReferenceUid
            - mobileNumber
          examples:
            ID:
              summary: Indonesia request body example
              value:
                requestId: R897321804
                externalReferenceUid: E897321804
                mobileNumber: '+628129801929'
                email: xxx@xxx.com
                extendInfo:
                  language: id
    CreditResult:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreditApplicationResult'
    RefundResult:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/RefundResult'
    PaymentPlanParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              externalReferenceUid:
                type: string
                description: reference id to the end user on the partner side
                maxLength: 64
              totalAmount:
                type: integer
                description: Total order amount in IDR (Rupiah). Must meet the minimum for the selected installment tenor (1-month >= 1; 3-month >= 20,000).
              subOrders:
                type: array
                description: One entry per SKU (one SKU = one sub-order). Each `amount` must meet the minimum for the selected tenor (1-month >= 1; 3-month >= 3).
                items:
                  $ref: '#/components/schemas/PlanSubOrder'
              extendInfo:
                type: object
                description: Optional extension fields per integration agreement.
                properties:
                  orderType:
                    $ref: '#/components/schemas/PaymentOrderType'
                  riskInfo:
                    $ref: '#/components/schemas/paymentPlanRiskInfo'
            required:
            - externalReferenceUid
            - totalAmount
            - subOrders
    RefundParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                description: Partner-side idempotent request identifier (max 64 chars).
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user.
                maxLength: 64
              captureRequestId:
                type: string
                description: |
                  `requestId` of the original `POST /capture` call that created the loan being refunded.
                  Use the same value the partner sent on capture; refund is always issued against a captured order.
                maxLength: 64
              refundAmount:
                type: integer
                description: Total refund amount for the order. The minimum denomination in Indonesia is Rupiah (IDR).
              subOrders:
                type: array
                items:
                  $ref: '#/components/schemas/SubOrderRefundRequest'
              extendInfo:
                type: object
                description: Optional extension fields per integration agreement.
            required:
            - requestId
            - externalReferenceUid
            - captureRequestId
            - refundAmount
            - subOrders
    RepaymentParam:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: reference id to the end user on the partner side
                maxLength: 64
              repaymentAmount:
                type: integer
                description: total repayment amount .The minimum denomination in Indonesia is Rupiah (IDR).
              repaymentApplyTime:
                type: integer
                description: Timestamp(unix millisecond)
              extendInfo:
                type: object
                description: Optional extension fields per integration agreement.
            required:
            - requestId
            - externalReferenceUid
            - repaymentAmount
            - repaymentApplyTime
  schemas:
    CurrencyCode:
      type: string
      description: Currency code per [ISO 4217](https://www.iso.org/iso-4217-currency-codes.html). Currently only `IDR` is
        supported.
      enum:
      - IDR
      example: IDR
    CallbackAckResponse:
      type: object
      description: Body your endpoint returns to acknowledge a callback.
      properties:
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          description: Human-readable acknowledgement text.
      required:
      - code
      - message
    AuthAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`SUCCESS`: Request accepted. Business outcome lives in `data.status` — on first submission it is typically
            `PROCESSING` (terminal result via callback); on idempotent retry after completion it is `SUCCESS` / `FAILED`.<br/>

            `INVALID_ORDER_AMOUNT`: `totalAmount` or a sub-order `amount` is below the minimum for `periodType`, or above the
            maximum installable amount.<br/>

            `CREDIT_APPLICATION_NOT_APPROVED`: User''s application for credit was not approved<br/>

            `USER_CREDIT_LIMIT_INSUFFICIENT`: Available credit is insufficient for the requested amount.<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: The account is blocked due to overdue bills<br/>

            `ACCOUNT_BLOCKED`: The account is blocked due to risk or compliance reasons<br/>

            `ACCOUNT_TEMP_BLOCKED`: The account is temporarily blocked<br/>

            `RISK_REJECT`: Risk control declined the authorization.<br/>

            `FEE_CHANGE`: Fee configuration changed since `/payment-plan`; call `/payment-plan` again before retrying.<br/>

            '
          enum:
          - SUCCESS
          - INVALID_ORDER_AMOUNT
          - CREDIT_APPLICATION_NOT_APPROVED
          - USER_CREDIT_LIMIT_INSUFFICIENT
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
          - ACCOUNT_TEMP_BLOCKED
          - RISK_REJECT
          - FEE_CHANGE
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/AuthAuthorizationData'
    AuthAuthorizationData:
      type: object
      description: Payload under `data` while authorization is processed or completed; additional optional fields may appear
        when processing finishes.
      required:
      - requestId
      - currency
      - authOrderId
      - totalAmount
      - status
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        authOrderId:
          type: string
          description: Authorization identifier for this hold; use on `/capture` and `/voidAuth`.
        totalAmount:
          type: integer
          description: Total amount for the order, expressed in the smallest currency unit of the configured country (IDR;
            smallest unit is Rupiah).
        status:
          type: string
          description: Business status of the authorization.
          enum:
          - PROCESSING
          - SUCCESS
          - FAILED
        failureCode:
          type: string
          description: 'Present when `status` is `FAILED`.<br/>

            `USER_CREDIT_LIMIT_INSUFFICIENT`: Available credit is insufficient for the requested amount.<br/>

            `RISK_REJECT`: Risk control declined the authorization; see `extendInfo.reapplyTime` when retry is allowed.

            '
          enum:
          - USER_CREDIT_LIMIT_INSUFFICIENT
          - RISK_REJECT
        subOrderInstallmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/SubOrderInstallmentPlans'
        accountChanges:
          $ref: '#/components/schemas/AccountChanges'
        extendInfo:
          type: object
          description: Optional extension fields on `data`. When `status` is `FAILED` and `failureCode` is `RISK_REJECT`, may include `reapplyTime`.
          properties:
            reapplyTime:
              type: integer
              description: Unix timestamp in milliseconds when the user may submit authorization again. Omitted when not applicable. Example `1623052669233`.
    CaptureAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`SUCCESS`: Request accepted; see `data.status` for business outcome (`PROCESSING` on first submission; terminal states via callback or idempotent retry).<br/>

            `INVALID_ORDER_AMOUNT`: `totalAmount` or a sub-order `amount` is below the minimum for `periodType`, or above the
            maximum installable amount.<br/>

            `CREDIT_APPLICATION_NOT_APPROVED`: Credit application is not approved.<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Account is blocked due to overdue bills.<br/>

            `ACCOUNT_BLOCKED`: Account is blocked due to risk or compliance reasons.<br/>

            '
          enum:
          - SUCCESS
          - INVALID_ORDER_AMOUNT
          - CREDIT_APPLICATION_NOT_APPROVED
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/CaptureResultData'
    CaptureResultData:
      allOf:
      - $ref: '#/components/schemas/PaymentResult'
      - type: object
        required:
        - authOrderId
        properties:
          authOrderId:
            type: string
            description: Authorization identifier from the preceding `/auth` call.
    VoidAckResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          enum:
          - SUCCESS
        message:
          type: string
          description: Human-readable outcome or error detail.
        data:
          $ref: '#/components/schemas/VoidResultData'
    VoidResultData:
      type: object
      required:
      - requestId
      - externalReferenceUid
      - authOrderId
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        externalReferenceUid:
          type: string
          maxLength: 64
          description: Partner-side stable identifier for the end user.
        authOrderId:
          type: string
          description: Authorization identifier that was voided.
        accountChanges:
          $ref: '#/components/schemas/AccountChanges'
    PaymentStyle400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `PARAMS_WRONG`: Wrong parameter, e.g. inconsistent amounts or too many sub-order lines<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            `SESSION_NOT_FOUND`: The session is not started or invalid<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - PARAMS_WRONG
          - NOT_FOUND
          - SESSION_NOT_FOUND
        message:
          type: string
          description: Human-readable error detail.
    Capture400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `PARAMS_WRONG`: Wrong parameter, e.g. inconsistent amounts or too many sub-order lines<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            `CAPTURE_AMOUNT_EXCEED`: Capture amount out of range<br/>

            `AUTH_EXPIRED`: Capture exceeds the time limit<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - PARAMS_WRONG
          - NOT_FOUND
          - CAPTURE_AMOUNT_EXCEED
          - AUTH_EXPIRED
        message:
          type: string
          description: Human-readable error detail.
    Void400Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          description: '`PARAMS_MISSING`: Missing parameter<br/>

            `WRONG_PARAMS_FORMAT`: Wrong parameter format<br/>

            `NOT_FOUND`: Data not found, e.g. user account does not exist<br/>

            '
          enum:
          - PARAMS_MISSING
          - WRONG_PARAMS_FORMAT
          - NOT_FOUND
        message:
          type: string
          description: Human-readable error detail.
    InstallmentDetail:
      type: object
      properties:
        subOrderId:
          type: string
          description: Sub-order identifier; must match `subOrders[].subOrderId` from the request.
          maxLength: 64
        totalTenor:
          type: integer
          description: Total number of installments for this segment.
        currentTenor:
          type: integer
          description: Current installment index within `totalTenor`.
        repayAmount:
          type: integer
          description: Principal plus interest due for this installment (smallest currency unit).
        principalAmount:
          type: integer
          description: Principal portion for this installment (smallest currency unit).
        interestAmount:
          type: integer
          description: Interest portion for this installment (smallest currency unit).
        billId:
          type: string
          description: Billing period identifier (`yyyyMM`).
        billDate:
          type: string
          description: Bill date (`yyyy-MM-dd`).
        dueDate:
          type: string
          description: Repayment due date (`yyyy-MM-dd`).
      required:
      - subOrderId
      - totalTenor
      - currentTenor
      - repayAmount
      - principalAmount
      - interestAmount
      - billId
      - billDate
      - dueDate
    InstallmentPlan:
      type: object
      properties:
        totalTenor:
          type: integer
          description: Total number of installments for this plan.
        orderRepayAmount:
          type: integer
          description: Total principal plus interest for the plan (smallest currency unit).
        orderInterestAmount:
          type: integer
          description: Total interest for the plan (smallest currency unit).
        installmentDetails:
          type: array
          items:
            $ref: '#/components/schemas/InstallmentDetail'
      required:
      - totalTenor
      - installmentDetails
      - orderRepayAmount
      - orderInterestAmount
    SubOrderInstallmentPlans:
      type: object
      properties:
        subOrderId:
          type: string
          description: Sub-order identifier; must match `subOrders[].subOrderId` from the `/auth` or `/capture` request.
          maxLength: 64
        orderAmount:
          type: integer
          description: Principal amount for this sub-order (smallest currency unit).
        installmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/InstallmentPlan'
      required:
      - subOrderId
      - orderAmount
      - installmentPlans
    SubOrder:
      type: object
      description: 'Line item under the parent order. **One SKU = one sub-order.**

        Required fields align with `PlanSubOrder` used in `/payment-precheck` and `/payment-plan`. Minimum `amount` depends
        on order `periodType` (1-month >= 1 IDR; 3-month >= 3 IDR).

        '
      properties:
        periodType:
          type: integer
          description: Installment tenor for this line item (e.g. 1, 3, 6, 9, or 12).
        subOrderId:
          type: string
          description: Stable sub-order identifier for this line item; use the same value across `/auth`, `/capture`, callbacks,
            and reconciliation.
          maxLength: 64
        skuId:
          type: string
          description: Product SKU identifier.
          maxLength: 64
        creatorId:
          type: string
          description: Creator or influencer identifier, when applicable.
        skuName:
          type: string
          description: Human-readable SKU name.
        spuId:
          type: string
          description: Standard product unit (SPU) identifier.
        categoryId:
          type: string
          description: Product category identifier.
          maxLength: 128
        categoryOneName:
          type: string
          description: Primary category label at SKU level.
          maxLength: 128
        categoryCodes:
          type: array
          description: 'Category codes for this line item (example: `DIGITAL`, `MOBILE_TABLET`, `OTHER_ELECTRONICS`). Multiple
            values allowed.'
          items:
            type: string
        quantity:
          type: integer
          minimum: 1
          description: Number of units for this line item; must be a positive integer.
        amount:
          type: integer
          description: Sub-order (SKU) total amount in IDR (Rupiah). Minimum depends on order `periodType` (1-month >= 1; 3-month >= 3).
        merchantId:
          type: string
          description: 'Food & Mart (`GRAB_FOOD`, `GRAB_MART`, `SPECIALIZED_DELIVERY`): merchant ID. Transport (`TRANSPORT`): driver ID.'
        merchantName:
          type: string
          description: 'Food & Mart: merchant name. Transport: driver name.'
        merchantCategory:
          type: string
          description: 'Food & Mart: merchant category. Transport: omit or pass null.'
        merchantJoinedDate:
          type: string
          description: 'Food & Mart: merchant onboarding date. Transport: driver registration date.'
        extendInfo:
          type: object
          description: Optional extension fields for this line item.
      required:
      - subOrderId
      - categoryId
      - skuId
      - amount
      - quantity
      - merchantId
      - categoryOneName
    AccountChanges:
      description: 'Account balance or status impact returned with an API response.<br/>

        '
      type: object
      properties:
        externalReferenceUid:
          type: string
          description: Partner-side stable identifier for the end user in your system.
          maxLength: 64
        previousStatus:
          type: string
          description: 'Original status of account<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

            `ACCOUNT_BLOCKED`: Risk block<br/>

            '
          enum:
          - NORMAL
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
        currentStatus:
          type: string
          description: 'Current status of account<br/>

            `NORMAL`: The normal status<br/>

            `ACCOUNT_BLOCKED_OVERDUE`: Overdue block<br/>

            `ACCOUNT_BLOCKED`: Risk block<br/>

            `ACCOUNT_CLOSED`: Account closed<br/>

            '
          enum:
          - NORMAL
          - ACCOUNT_BLOCKED_OVERDUE
          - ACCOUNT_BLOCKED
          - ACCOUNT_CLOSED
        totalCreditChange:
          type: integer
          description: Change in total credit limit (smallest currency unit).
        usedCreditChange:
          type: integer
          description: Change in used credit (smallest currency unit).
        frozenCreditChange:
          type: integer
          description: Change in frozen credit from authorization hold (smallest currency unit).
        availableCreditChange:
          type: integer
          description: Change in available credit (smallest currency unit).
        overpaidAmountChange:
          type: integer
          description: Change in overpaid balance (smallest currency unit).
        lateFeeAmountChange:
          type: integer
          description: Change in late fee balance (smallest currency unit).
        interestAmountChange:
          type: integer
          description: Change in interest balance (smallest currency unit).
        version:
          type: integer
          description: 'Monotonic version or event time in Unix milliseconds (example: 1623052669233).'
      required:
      - externalReferenceUid
      - version
    PaymentResult:
      type: object
      properties:
        requestId:
          type: string
          maxLength: 64
          description: Partner-side idempotent request identifier (max 64 chars).
        currency:
          $ref: '#/components/schemas/CurrencyCode'
        orderId:
          type: string
          maxLength: 32
          description: Order identifier returned by Atome.
        totalAmount:
          type: integer
          description: Total amount for the order, expressed in the smallest currency unit of the configured country (IDR;
            smallest unit is Rupiah).
        status:
          type: string
          description: 'Business status of the operation.<br/>

            Synchronous `/auth` / `/capture` responses may return any of `PROCESSING`, `SUCCESS`, `FAILED` — `PROCESSING`
            on first submission while work is in progress, and `SUCCESS` / `FAILED` either once the work has completed (idempotent
            retry with the same `requestId`) or when the decision can be made inline.<br/>

            Callbacks (`/<authNotifyUrl>`, `/<captureNotifyUrl>`) are sent **only** at terminal states and always carry `SUCCESS`
            or `FAILED`; they **never** carry `PROCESSING`.

            '
          enum:
          - PROCESSING
          - FAILED
          - SUCCESS
        failureCode:
          type: string
          description: 'Present when `status` is `FAILED`.<br/>

            `RISK_REJECT`: Risk control declined capture; see `extendInfo.reapplyTime` when retry is allowed.

            '
          enum:
          - RISK_REJECT
        subOrderInstallmentPlans:
          type: array
          items:
            $ref: '#/components/schemas/SubOrderInstallmentPlans'
        accountChanges:
          allOf:
          - $ref: '#/components/schemas/AccountChanges'
          description: '`status=FAILED`: Only account state changes occur in the `accountChanges` structure when the terminal
            state is `FAILED`.<br/>

            `status=SUCCESS`: Only account credit changes occur in the `accountChanges` structure when the terminal state
            is `SUCCESS`.<br/>

            '
        extendInfo:
          type: object
          description: Optional extension fields on `data`. When `status` is `FAILED` and `failureCode` is `RISK_REJECT`, may include `reapplyTime`.
          properties:
            reapplyTime:
              type: integer
              description: Unix timestamp in milliseconds when the user may submit capture again. Omitted when not applicable. Example `1623052669233`.
            agreement:
              type: object
              properties:
                agreementUrl:
                  type: string
                  description: Loan agreement URL when available after a successful capture (e.g. terminal `/capture` response or `/<captureNotifyUrl>`), not while `status` is `PROCESSING`.
      required:
      - requestId
      - orderId
      - status
      - totalAmount
      - currency
    paymentRiskInfo:
      type: object
      description: Risk payload for `/auth` and `/capture`. `driverInfo` and `tripMetadata` apply only when `extendInfo.orderType` is `TRANSPORT`.
      properties:
        driverInfo:
          type: object
          description: Driver information. Transport orders only.
          properties:
            averageRating:
              type: number
              format: double
              description: Driver average rating.
            isVerified:
              type: boolean
              description: Whether the driver is verified.
        tripMetadata:
          type: object
          description: Trip metadata. Transport orders only.
          properties:
            estimatedDistance:
              type: string
              description: Estimated trip distance.
            pickupLocation:
              type: string
              description: Pickup location.
    PlatformDeviceInfo:
      type: object
      description: User device information at submission time. Same structure as `applicationEssentialInfo.platformInformation.deviceInfo` in `POST /credit-application`.
      properties:
        platform:
          type: string
          enum:
          - ANDROID
          - IOS
        gps:
          type: object
          properties:
            longitude:
              type: string
            latitude:
              type: string
            time:
              type: string
              description: GPS sample time (Unix milliseconds, as string).
        device:
          type: object
          properties:
            deviceId:
              type: string
              description: Partner-side device identifier.
            googleAdvertisingId:
              type: string
              description: Google Advertising ID (GAID); Android clients.
            idfa:
              type: string
              description: Identifier for Advertisers (IDFA); iOS clients.
            idfv:
              type: string
              description: Identifier for Vendor (IDFV); iOS clients.
            utdid:
              type: string
            isRoot:
              type: boolean
            androidId:
              type: string
            build:
              type: object
              description: Android `Build.*` fields; required for Android clients.
              properties:
                board:
                  type: string
                brand:
                  type: string
                cpuAbi:
                  type: string
                device:
                  type: string
                manufacturer:
                  type: string
                model:
                  type: string
                product:
                  type: string
        wifiList:
          type: array
          description: Visible Wi-Fi networks at submission time.
          items:
            type: object
            properties:
              ssid:
                type: string
        ipAddress:
          type: object
          properties:
            ethIp:
              type: string
            trueIp:
              type: string
    PaymentOrderType:
      type: string
      description: Order business line that determines merchant and risk field semantics.
      enum:
      - TRANSPORT
      - GRAB_FOOD
      - GRAB_MART
      - SPECIALIZED_DELIVERY
    CreditSceneType:
      type: string
      description: Entry scene where the user started the credit application on the partner UI.
