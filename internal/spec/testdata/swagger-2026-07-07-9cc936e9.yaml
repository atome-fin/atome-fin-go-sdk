    | 2026-07-06 | Payment | `extendInfo.orderType` enum updated: `GRABFOOD` → `GRAB_FOOD`, `GRABMART` → `GRAB_MART`, `SPECIALIZED DELIVERY` → `SPECIALIZED_DELIVERY`; `TRANSPORT` unchanged. |

    | 2026-07-06 | Credit | `POST /credit-application` `applicationEssentialInfo.platformInformation.sceneType` enum: `PRODUCT_LANDING_PAGE`, `PROMO_BANNER_PAGE`, `MARKETING_PUSH_ENTRY`, `CHECKOUT_PAGE`, `WALLET_DASHBOARD_ENTRY`. |

    | 2026-07-07 | Credit & Payment | `creditProfile` JSON structure aligned across `POST /credit-application`, `POST /auth`, and `POST /capture`; partner and Atome agree the risk-control field set during integration — sample payload is illustrative only. |'

- name: signature
  description: "We use RSA2(2048 bit) encryption algorithm, and through the exchange of public key certificate to verify the\
    \ signature. Encrypt the signature with salt if necessary,\nand in this condition we should exchange another public key\
    \ certificate.\n- ATOME provide:\n  - Public key certificate: The validity period is 3 year\n- Partner provide:\n  - Public\
    \ key certificate: The validity period is 3 year\n- Params:\n  - Request Headers: add param `Authorization`\n  - GET:\
    \ Sign the request parameters which parameter names are sorted in alphabetical natural order\n  - POST: Sign with the\
    \ payload.\n"
- name: HealthCheck
- name: Credit
- name: Payment
  description: '**Auth–Capture–Void:** Auth freezes limit; capture completes the order; void releases the hold. **`/voidAuth`**
    is allowed only after `/auth` succeeds (`SUCCESS`) and before `/capture` is submitted for the same `authOrderId`; not allowed
    while capture is `PROCESSING` or after capture has been submitted. Partner
    must treat `requestId` as an idempotent key for every `/auth`, `/capture`, and `/voidAuth` request.

    **Installments / checkout:** Pre-check, payment plan, `/query-auth`, `/query-capture`, and `/query-voidAuth` use the same
    `Payment` tag; treat `requestId` as idempotent per integration rules for those paths.

    **Minimum order / sub-order amounts:** One SKU = one sub-order. For `periodType` = 1: order >= 1 IDR, each sub-order >= 1
    IDR; for `periodType` = 3: order >= 20,000 IDR, each sub-order >= 3 IDR. Partners must validate `totalAmount` and
    `subOrders[].amount` before `POST /payment-precheck`, `POST /payment-plan`, `POST /auth`, and `POST /capture`.

    '
- name: Repayment
- name: Refund
  description: 'Asynchronously notify the final order result,  and notify the result by callback.</br>

    If the partner gets the final result before the callback, the callback will still be executed, the partner ensuring idempotency.</br>

    '
- name: Bill
- name: Transaction
- name: Callback
  description: 'Server-to-server notifications implemented on the **partner** side. Atome calls the partner-configured HTTPS
    URL **only when** `/auth` or `/capture` reaches a **terminal** `data.status` (e.g. `SUCCESS` or `FAILED`). While the synchronous
    API still shows **processing** (`PROCESSING`), Atome does **not** send these callbacks. After a terminal state is reached,
    the partner may also obtain the same terminal outcome via **idempotent** `/auth` / `/capture` retry (same `requestId`).

    '
