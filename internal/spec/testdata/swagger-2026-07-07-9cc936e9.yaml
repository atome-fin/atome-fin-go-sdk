    tradeBillDetail:
      type: object
      properties:
        billId:
          type: string
          description: 'format: yyyyMM'
        billDate:
          type: string
          description: 'format: yyyyMMdd'
        dueDate:
          type: string
          description: 'Repayment period of bill. format: yyyyMMdd'
