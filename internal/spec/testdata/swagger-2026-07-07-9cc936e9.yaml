        and enum definitions. Final field set is agreed per integration contract.

        '
      properties:
        livenessCheck:
          type: object
          description: Liveness check result with the photo.
          required:
          - result
          - snapshotPhoto
          properties:
            result:
              type: string
              description: Liveness check outcome.
              enum:
              - PASS
              - FAIL
            snapshotPhoto:
              type: string
              description: Base64-encoded liveness snapshot photo.
            livenessCheckResult01:
              type: string
              description: Liveness score.
            livenessCheckResult02:
              type: string
              description: Face quality score (`face_quality.score`).
            livenessCheckResult03:
              type: string
              description: Action results from the liveness check (`action_results`).
        individualProfile:
          type: object
          description: KYC profile of the end user.
          properties:
            idType:
              type: string
              description: 'Government-issued ID type. Example: `KTP` for Indonesia.'
            ocrResult:
              type: object
              description: OCR-extracted fields from the ID document photo.
              properties:
                idNumber:
                  type: string
                  description: ID document number.
                fullName:
                  type: string
                  description: Full legal name as printed on the ID.
                birthPlace:
                  type: string
                  description: Place of birth (free text).
                ocrBloodType:
                  type: string
                ocrReligion:
                  type: string
                ocrGender:
                  type: string
                  enum:
                  - MAN
                  - WOMAN
                manuallyBirthDate:
                  type: string
                  description: Birth date (`yyyy-MM-dd`).
                ocrProvince:
                  type: string
                  description: Province on the ID as extracted by OCR.
                ocrCity:
                  type: string
                  description: City / regency on the ID as extracted by OCR.
                ocrDistrict:
                  type: string
                  description: District on the ID as extracted by OCR.
                jobType:
                  type: string
                ocrMaritalStatus:
                  type: string
                  enum:
                  - SINGLE
                  - MARRIED
                  - DIVORCED
                  - WIDOWED
                  - SEPARATED
                  - OTHERS
                manuallyExpiredDate:
                  type: string
                  description: Expiry date of the ID document.
                manuallyCitizenship:
                  type: string
                  description: Citizenship or nationality as printed on the ID (OCR-extracted text).
                manuallyRt:
                  type: string
                  description: RT (neighborhood unit) on the ID as extracted by OCR.
                manuallyRw:
                  type: string
                  description: RW (community unit) on the ID as extracted by OCR.
            idFrontPhoto:
              type: string
              description: |-
                Base64-encoded front-side photo of the ID document.

                The services check and extract the necessary information from the uploaded images, hence please ensure the uploaded images satisfy the following criteria:
                - Is in one of the following image formats: PNG / JPG / JPEG
                - Below 2 MB file size
                - Minimum resolution of 256 x 256
                - Maximum resolution of 4096 x 4096
            manuallyEducation:
              type: string
              enum:
              - PRIMARY
              - JUNIOR HIGH SCHOOL
              - SENIOR HIGH SCHOOL
              - DIPLOMA
              - BACHELOR
              - MASTER
              - PHD-DOCTOR
