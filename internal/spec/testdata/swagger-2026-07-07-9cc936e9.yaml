components:
  requestBodies:
    AuthRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user in your system.
                maxLength: 64
              totalAmount:
                type: integer
                description: Total order amount in IDR (Rupiah). Minimum depends on `periodType` (1-month >= 1; 3-month >= 20,000).
              periodType:
                type: integer
                description: Installment tenor for the order (e.g. 1, 3, 6, 9, or 12). Determines minimum order and sub-order amounts — see **Minimum order / sub-order amounts** in Overview.
              subOrders:
                type: array
                description: One entry per SKU (one SKU = one sub-order). Sum of `amount` values should align with `totalAmount`; each `amount` must meet the minimum for `periodType` (1-month >= 1; 3-month >= 3).
                items:
                  $ref: '#/components/schemas/SubOrder'
              extendInfo:
                type: object
                description: Optional extended fields for risk and fulfillment. `orderType`, `creditProfile` (sample structure is **for reference only** — align with Atome during integration), `userCreditScore`, `deviceInfo`, `address`, and `riskInfo` are optional unless agreed per integration.
                properties:
                  orderType:
                    $ref: '#/components/schemas/PaymentOrderType'
                  creditProfile:
                    $ref: '#/components/schemas/CreditProfile'
                  userCreditScore:
                    type: number
                    format: double
                    description: Credit score between 0 and 1 (double); user-level signal when provided.
                  deviceInfo:
                    $ref: '#/components/schemas/PlatformDeviceInfo'
                  address:
                    type: object
                    properties:
                      shippingAddress:
                        type: object
                        properties:
                          state:
                            type: string
                          city:
                            type: string
                          district:
                            type: string
                          address1:
                            type: string
                          address2:
                            type: string
                      shippingName:
                        type: string
                        description: Consignee name. For **Transport** orders (`orderType` = `TRANSPORT`), pass the trip destination address label.
                      shippingPhoneNo:
                        type: string
                        description: Consignee mobile number. For **Transport** orders (`orderType` = `TRANSPORT`), pass the passenger mobile number for the trip.
                  riskInfo:
                    $ref: '#/components/schemas/paymentRiskInfo'
            required:
            - requestId
            - externalReferenceUid
            - totalAmount
            - periodType
            - subOrders
    CaptureRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user in your system.
                maxLength: 64
              authOrderId:
                type: string
                description: Authorization reference returned in the `/auth` response.
                maxLength: 64
              totalAmount:
                type: integer
                description: Total capture amount in IDR (Rupiah). **Must equal** the `totalAmount` from the corresponding `/auth` call; uplift is not allowed. Must meet the minimum for `periodType` (1-month >= 1; 3-month >= 20,000).
              periodType:
                type: integer
                description: Installment tenor; **must match** `/auth`. Determines minimum order and sub-order amounts — see **Minimum order / sub-order amounts** in Overview.
              subOrders:
                type: array
                description: One entry per SKU (one SKU = one sub-order). Set and amounts **must match** `/auth`; each `amount` must meet the minimum for `periodType` (1-month >= 1; 3-month >= 3).
                items:
                  $ref: '#/components/schemas/SubOrder'
              extendInfo:
                type: object
                description: Optional extended fields for risk and fulfillment. `orderType`, `creditProfile` (sample structure is **for reference only** — align with Atome during integration), `userCreditScore`, `deviceInfo`, `address`, and `riskInfo` are optional unless agreed per integration.
                properties:
                  orderType:
                    $ref: '#/components/schemas/PaymentOrderType'
                  creditProfile:
                    $ref: '#/components/schemas/CreditProfile'
                  userCreditScore:
                    type: number
                    format: double
                    description: Credit score between 0 and 1 (double); user-level signal when provided.
                  deviceInfo:
                    $ref: '#/components/schemas/PlatformDeviceInfo'
                  address:
                    type: object
                    properties:
                      shippingAddress:
                        type: object
                        properties:
                          state:
                            type: string
                          city:
                            type: string
                          district:
                            type: string
                          address1:
                            type: string
                          address2:
                            type: string
                      shippingName:
                        type: string
                        description: Consignee name. For **Transport** orders (`orderType` = `TRANSPORT`), pass the trip destination address label.
                      shippingPhoneNo:
                        type: string
                        description: Consignee mobile number. For **Transport** orders (`orderType` = `TRANSPORT`), pass the passenger mobile number for the trip.
                  riskInfo:
                    $ref: '#/components/schemas/paymentRiskInfo'
            required:
            - requestId
            - externalReferenceUid
            - authOrderId
            - totalAmount
            - periodType
            - subOrders
    VoidRequest:
      required: true
      content:
        application/json:
          schema:
            type: object
            properties:
              requestId:
                type: string
                maxLength: 64
              externalReferenceUid:
                type: string
                description: Partner-side stable identifier for the end user in your system.
                maxLength: 64
              authOrderId:
                type: string
                description: 'authOrderId from a terminal `/auth` response with `status` = `SUCCESS`; no `/capture` may exist for this authorization (including capture `PROCESSING`).'
                maxLength: 64
            required:
            - requestId
            - externalReferenceUid
            - authOrderId
    AuthCallbackRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthAckResponse'
    CaptureCallbackRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CaptureAckResponse'
