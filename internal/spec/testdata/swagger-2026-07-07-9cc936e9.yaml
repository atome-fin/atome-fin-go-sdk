    | 2026-05-06 | Scope | Expanded partner white-label spec: credit & checkout (pricing / pre-check / plan), refunds, bills,
    transactions, repayment, account callbacks. |

    | 2026-05-19 | Servers | Pre-production and production gateway base path suffix `grabpaylater`; production host TBD. |

    | 2026-06-03 | Credit | `POST /credit-application`: `ocrResult` adds `manuallyValidityDate`, `manuallyCitizenship`. |

    | 2026-06-03 | Payment | `/payment-precheck` response `data.extendInfo.reapplyTime` (int64) when `code` is `RISK_REJECT`. |

    | 2026-06-08 | Repayment | Repayment result and callback `event` retains `NORMAL` only; removes `CHARGEBACK`, `ATOME_REPAYMENT`, `OVERPAID_REPAYMENT`. |

    | 2026-06-09 | Payment | Minimum order / sub-order amounts by `periodType`; partner-side validation on precheck, payment-plan, auth, capture. |

    | 2026-06-15 | Credit | `POST /credit-information` `extendInfo.language` is optional; defaults to `id` when omitted. |

    | 2026-06-22 | Credit | <ol><li>`POST /credit-application` `applicationEssentialInfo` adds `livenessCheck` (`result`, `snapshotPhoto`, `livenessResult01` liveness score / `02` face quality / `03` action results), `applicationPageType`, device `deviceId` / `googleAdvertisingId` / `idfa` / `idfv`.</li><li>`applicationEssentialInfo.platformInformation.applicationPageType` enum: `PRODUCT_LANDING_PAGE`, `PROMO_BANNER_PAGE`, `MARKETING_PUSH_ENTRY`, `CHECKOUT_PAGE`, `WALLET_DASHBOARD_ENTRY`.</li><li>`POST /credit-application` KYC: `ocrResult.manuallyRtRw`; OCR province/city/district descriptions updated.</li><li>`ocrResult` renames `ocrValidityDate` → `manuallyValidityDate`, `ocrCitizenship` → `manuallyCitizenship`.</li></ol> |

    | 2026-06-24 | Payment | Payment risk fields: `extendInfo.orderType`; auth/capture `creditProfile`, address & sub-order merchant fields, `riskInfo.driverInfo`/`tripMetadata` (Transport). |

    | 2026-06-25 | Payment | `/payment-precheck` `extendInfo` removes `sceneCode`. |

    | 2026-06-28 | Credit | `POST /credit-information`: removes `eventType`; adds required `mobileNumber` and `applicationEssentialInfo.ocrResult.fullName`. |

    | 2026-06-30 | Credit | `POST /credit-application` `applicationEssentialInfo.livenessCheck` is required; `result` and `snapshotPhoto` are required. |

    | 2026-07-06 | Credit | `POST /credit-application` renames: `livenessResult01/02/03` → `livenessCheckResult01/02/03`; `applicationPageType` → `sceneType`; `ocrResult.manuallyRtRw` → `manuallyRt` & `manuallyRw`; `manuallyValidityDate` → `manuallyExpiredDate`. |

    | 2026-07-06 | Payment | `POST /auth` and `POST /capture` `subOrders[]` required fields aligned with `/payment-plan`  |

