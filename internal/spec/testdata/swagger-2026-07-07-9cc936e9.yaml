          type: object
          description: User information on the partner platform.
          properties:
            creditProfile:
              $ref: '#/components/schemas/CreditProfile'
            sceneType:
              $ref: '#/components/schemas/CreditSceneType'
            deviceInfo:
              $ref: '#/components/schemas/PlatformDeviceInfo'
      required:
      - livenessCheck
      - individualProfile
      - platformInformation
